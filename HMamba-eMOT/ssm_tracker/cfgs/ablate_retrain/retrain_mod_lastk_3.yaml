dataset:
  window_size: 12
  manner: diff
  skip_sample: 1
  scale_factor: 50
  frame_hypergraph: true
  modal_feature_root: ../data/femot_modal_gt
  max_objects: 32
  sequence_cache_size: 100
  hyper_spatial_radius: 0.1
  hyper_rgb_threshold: 0.8407866
  hyper_evt_threshold: 0.9955849
  hyper_topk: 5
train:
  model: MambaTrack
  batch_size: 64
  num_workers: 0
  optimizer: adam
  lr0: 5.0e-05
  lr_scheduler: none
  epochs: 3
  grad_clip: 1.0
  loss_skip_thresh: 1.0
  q: 10
  d_m: 512
  d_state: 16
  L: 3
  avg_pool_out_dim:
  - 1
  - 128
  pred_head_dims:
  - 64
  - 4
  save_period: 1
  use_hyper_b: false
  use_spatial_hyper: false
  use_spatial_ssm_mod: true
  spatial_hyper_dim: 64
  spatial_hyper_edge_agg: mean
  ssm_mod_alpha_dt: 0.1
  ssm_mod_alpha_b: 0.1
  ssm_mod_alpha_c: 0.1
  ssm_mod_last_k: 3
inference:
  filter_thresh: 0.2
  new_track_thresh: 0.55
  enable_time_thresh: 2
  max_window: 11
  max_time_lost: 25
  match_mode: iou
  match_thresh_stage1: 0.7
  match_thresh_stage2: 0.9
  app_ema_momentum: 0.9
