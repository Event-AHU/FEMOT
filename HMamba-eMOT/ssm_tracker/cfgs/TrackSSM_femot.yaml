dataset:
  anno_path: 'traj_anno_data/femot.json'
  window_size: 7
  manner: 'bbox_and_diff'
  skip_sample: 1
  scale_factor: 20
  scale_factor_diff: 50


train:
  model: 'TrackSSM'
  batch_size: 128
  optimizer: 'sgd'
  lr0: 0.0
  lr_scheduler: 'transformer'
  epochs: 100
  cls_token: true
  cls_token_pos: 'tail'
  q: 5
  d_m: 512
  d_d: 256
  dt_rank: 'auto'
  d_state: 16
  L: 3
  lambda1: 1
  lambda2: 0
  save_period: 10


inference:
  filter_thresh: 0.2
  new_track_thresh: 0.6
  enable_time_thresh: 5
  max_window: 5
  max_time_lost: 30
