dataset:
  anno_path: 'traj_anno_data/dsec.json'
  window_size: 12
  manner: 'diff'
  skip_sample: 1
  scale_factor: 50


train:
  model: 'MambaTrack'
  batch_size: 64
  optimizer: 'sgd'
  lr0: 0.0
  lr_scheduler: 'transformer'
  epochs: 30
  q: 10
  d_m: 512
  d_state: 16
  L: 3
  avg_pool_out_dim:
    - 1
    - 128
  pred_head_dims:
    - 64
    - 4
  save_period: 1


inference:
  filter_thresh: 0.2
  new_track_thresh: 0.6
  enable_time_thresh: 6
  max_window: 11
  max_time_lost: 30
