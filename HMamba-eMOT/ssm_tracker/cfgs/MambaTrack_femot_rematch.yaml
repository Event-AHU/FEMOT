# Baseline MambaTrack + Stage2 rematch (IoU + RGB/Event appearance).
# Motion weights: mambatrack_femot/epoch25.pth (no spatial-hyper / ssm_mod).
dataset:
  anno_path: 'traj_anno_data/femot.json'
  window_size: 12
  manner: 'diff'
  skip_sample: 1
  scale_factor: 50

train:
  model: 'MambaTrack'
  batch_size: 64
  optimizer: 'sgd'
  lr0: 0.0
  lr_scheduler: 'transformer'
  epochs: 30
  q: 10
  d_m: 512
  d_state: 16
  L: 3
  avg_pool_out_dim:
    - 1
    - 128
  pred_head_dims:
    - 64
    - 4
  save_period: 1
  use_hyper_b: false
  use_spatial_hyper: false
  use_spatial_ssm_mod: false

inference:
  filter_thresh: 0.2
  new_track_thresh: 0.6
  enable_time_thresh: 6
  max_window: 11
  max_time_lost: 30
  # Stage1: pure IoU; Stage2: rematch (IoU + RGB/Event)
  match_mode: rematch
  match_thresh_stage1: 0.7
  # Fused cost stays ~[0,1]; keep 0.9 as starting point (re-sweep if needed)
  match_thresh_stage2: 0.9
  app_ema_momentum: 0.9
  assoc_modal_lambda: 0.4
  assoc_w_rgb: 0.5
  assoc_w_evt: 0.5
  assoc_iou_gate: 0.05
  # 0 disables center gate; set e.g. 2.5 to also forbid far pairs by box-diagonal units
  assoc_center_gate: 0.0
